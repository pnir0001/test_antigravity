openapi: 3.0.3
info:
  title: Memo App API
  version: 1.0.0
  description: API for a simple text memo application
servers:
  - url: http://localhost:8080/api/v1
paths:
  /memos:
    get:
      summary: List memos
      operationId: listMemos
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Memo'
    post:
      summary: Create a new memo
      operationId: createMemo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMemoRequest'
      responses:
        '201':
          description: Memo created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Memo'
  /memos/{id}:
    get:
      summary: Get a memo by ID
      operationId: getMemo
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Memo'
        '404':
          description: Memo not found
    put:
      summary: Update a memo
      operationId: updateMemo
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMemoRequest'
      responses:
        '200':
          description: Memo updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Memo'
        '404':
          description: Memo not found
    delete:
      summary: Delete a memo
      operationId: deleteMemo
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Memo deleted successfully
        '404':
          description: Memo not found

components:
  schemas:
    Memo:
      type: object
      required:
        - id
        - title
        - content
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        content:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CreateMemoRequest:
      type: object
      required:
        - title
        - content
      properties:
        title:
          type: string
        content:
          type: string
    UpdateMemoRequest:
      type: object
      required:
        - title
        - content
      properties:
        title:
          type: string
        content:
          type: string
